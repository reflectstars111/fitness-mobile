name: Android preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch verified model
        shell: pwsh
        run: ./scripts/fetch-model.ps1
      - name: Build APKs, lint, and core regression
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :motion-core:regressionTest --console=plain
      - name: Preserve preview and checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fitness-mobile-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.*
